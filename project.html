<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project — Anastasiia Bulatova</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link
      rel="apple-touch-icon"
      href="./assets/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="stylesheet" href="./css/main.css?v=29" />
    <link rel="stylesheet" href="./css/project.css?v=16" />
    <script>
      (function () {
        var entering = new URLSearchParams(location.search).has("enter");
        if (entering) document.documentElement.classList.add("is-entering");
        window.addEventListener("pagereveal", function (e) {
          if (!entering || !e.viewTransition) return;
          window.__projectVtEnter = true;
          window.__projectVt = e.viewTransition;
          document.documentElement.classList.add("is-vt-enter");
          try {
            var payload = JSON.parse(sessionStorage.getItem("projectEnter") || "null");
            var heroEl = document.querySelector("[data-hero]");
            if (heroEl && payload && payload.w) {
              heroEl.style.width = payload.w + "px";
              heroEl.style.height = payload.h + "px";
              heroEl.style.aspectRatio = "";
            }
          } catch (err) {
            /* ignore */
          }
        });
      })();
    </script>
  </head>
  <body class="page-project">
    <header class="site-chrome">
      <a class="site-brand" href="./index.html">Anastasiia Bulatova</a>
      <a
        class="site-all"
        href="./index.html?all=1"
        role="button"
        aria-pressed="false"
        >ALL PROJECTS</a
      >
      <div class="site-contacts">
        <p class="contact contact--cv" id="contact-cv">
          <a href="#" target="_blank" rel="noopener noreferrer">CV.pdf</a>
        </p>
        <p class="contact contact--email" id="contact-email">
          <a href="mailto:" aria-label="Email">mail</a>
        </p>
        <p class="contact contact--phone" id="contact-phone">
          <a href="tel:" aria-label="Phone">phone</a>
        </p>
      </div>
    </header>

    <div class="stage stage--project" id="stage" aria-label="Scroll project">
      <div class="world" id="world"></div>
    </div>

    <script type="module" src="./js/project-boot.js?v=3"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
